name: Deploy docs

on:
  push:
    branches:
      - docs       # preview from docs branch
      - master     # production from master

permissions:
  contents: read
  pages: write
  id-token: write

# A Pages deployment replaces the whole site with the uploaded artifact, so
# every run must publish both trees: production (master) at the root and the
# preview (docs branch) under preview/. One concurrency group for all refs
# keeps deploys queued and the published state identical regardless of which
# branch triggered the run.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Checkout production docs (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: prod

      - name: Checkout preview docs (docs branch)
        uses: actions/checkout@v4
        with:
          ref: docs
          path: preview

      - name: Build production docs into site root
        run: uv run mkdocs build -f prod/mkdocs.yml -d "$PWD/site"

      - name: Build preview docs into site/preview
        run: uv run mkdocs build -f preview/mkdocs.yml -d "$PWD/site/preview"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

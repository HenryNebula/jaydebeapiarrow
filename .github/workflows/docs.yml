name: Deploy docs

on:
  push:
    branches:
      - docs       # preview from docs branch
      - master     # production from master

permissions:
  contents: read
  pages: write
  id-token: write

# A Pages deployment replaces the whole site with the uploaded artifact, so
# every run publishes the full state: production (master) at the root, plus
# the preview (docs branch) under preview/. The preview is dropped from the
# artifact once its build is identical to production (docs merged) or the
# docs branch no longer exists, so /preview/ disappears without a manual
# step. One concurrency group for all refs keeps deploys queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check for preview branch
        id: preview
        run: |
          if git ls-remote --exit-code --heads origin docs > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout production docs (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: prod

      - name: Checkout preview docs (docs branch)
        if: steps.preview.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: docs
          path: preview

      - name: Build production docs into site root
        run: uv run mkdocs build -f prod/mkdocs.yml -d "$PWD/site"

      - name: Build preview docs into site/preview
        if: steps.preview.outputs.exists == 'true'
        run: |
          uv run mkdocs build -f preview/mkdocs.yml -d "$PWD/site/preview"
          if diff -r --brief --exclude=preview site site/preview; then
            rm -rf site/preview
            echo "Preview matches production; dropped from this deployment."
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

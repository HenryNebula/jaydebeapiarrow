name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Cache JDBC driver jars
      uses: actions/cache@v5
      with:
        path: test/jars/
        key: ${{ runner.os }}-jdbc-drivers-${{ hashFiles('test/download_jdbc_drivers.sh') }}
        restore-keys: |
          ${{ runner.os }}-jdbc-drivers-
    - name: Build with Maven
      run: bash test/build.sh
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Set version for TestPyPI
      if: github.event_name == 'workflow_dispatch'
      run: |
        VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        sed -i "s/version = \"$VERSION\"/version = \"$VERSION.dev${{ github.run_number }}\"/" pyproject.toml
    - name: Install build tools
      run: pip install build
    - name: Build wheel and tarball
      run: python3 -m build
    - name: Verify packaged data files
      run: |
        WHEEL=$(ls dist/*.whl | tail -1)
        python3 - "$WHEEL" <<'EOF'
        import glob
        import sys
        import zipfile

        z = zipfile.ZipFile(sys.argv[1])
        assert 'jaydebeapiarrow/logging.properties' in z.namelist()
        # Packaged Python sources must be byte-identical to the checkout —
        # guards against stale cache entries overwriting fresh sources.
        for src in glob.glob('jaydebeapiarrow/lib/*.py'):
            name = 'jaydebeapiarrow/lib/' + src.rsplit('/', 1)[-1]
            assert name in z.namelist(), f'{name} missing from wheel'
            assert z.read(name) == open(src, 'rb').read(), \
                f'{name} in wheel differs from checked-out source'
        print('wheel lib/ matches checkout')
        EOF
    - name: Verify package import from built wheel
      run: |
        WHEEL=$(ls dist/*.whl | tail -1)
        pip install "$WHEEL"
        python3 -c "import jaydebeapiarrow; print(f'OK: {jaydebeapiarrow.__version__} -> {jaydebeapiarrow.__version_info__}')"
    - name: Store artifact
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/JayDeBeApiArrow

    permissions:
      id-token: write

    steps:
    - name: Download dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Verify TestPyPI package
    needs: publish-to-testpypi
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Cache JDBC driver jars
      uses: actions/cache@v5
      with:
        path: test/jars/
        key: ${{ runner.os }}-jdbc-drivers-${{ hashFiles('test/download_jdbc_drivers.sh') }}
        restore-keys: |
          ${{ runner.os }}-jdbc-drivers-
    - name: Build with Maven
      run: bash test/build.sh
    - name: Install from TestPyPI
      run: pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ JayDeBeApiArrow
    - name: Install test dependencies
      run: pip install pytest JPype1
    - name: Run mock tests
      run: CLASSPATH="test/mock-jars/*" python -m pytest test/test_mock.py -v

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/JayDeBeApiArrow

    permissions:
      id-token: write

    steps:
    - name: Download dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

# Java util logging (JUL) configuration shipped with jaydebeapiarrow.
#
# Applied by default whenever connect() starts the JVM: the JVM is given
# -Djava.util.logging.config.file=<this file>.  SLF4J traffic (Arrow,
# netty, JDBC drivers) is routed into JUL by the bundled slf4j-jdk14
# binding, so this file governs all Java-side logging by default.
#
# Override by passing your own configuration via
# connect(..., jvm_args=["-Djava.util.logging.config.file=/my/logging.properties"]).
handlers=java.util.logging.ConsoleHandler
.level=WARNING
java.util.logging.ConsoleHandler.level=WARNING
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
# Single-line format (JDK 7+): timestamp level logger message [throwable]
java.util.logging.SimpleFormatter.format=%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS %4$-6s %2$s %5$s%6$s%n
